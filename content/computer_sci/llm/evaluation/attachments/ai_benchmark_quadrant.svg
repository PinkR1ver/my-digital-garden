<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark Quadrant Framework</title>
  <desc id="desc">A scholarly 2x2 quadrant chart mapping benchmarks by whether tasks are easy or hard for AI and humans.</desc>
  <defs>
    <style>
      .bg { fill: #fcfcfb; }
      .title { font: 700 52px "Times New Roman", "Noto Serif", Georgia, serif; fill: #111827; letter-spacing: 0.2px; }
      .subtitle { font: 400 24px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #4b5563; }
      .axis { stroke: #1f2937; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .axisLabel { font: 600 28px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .axisHint { font: 600 22px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #374151; }
      .quadTitle { font: 700 30px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #111827; letter-spacing: 0.1px; }
      .quadNote { font: 500 19px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #4b5563; }
      .chipText { font: 600 21px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .legendText { font: 500 18px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #4b5563; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1200"/>

  <text class="title" x="800" y="90" text-anchor="middle">Benchmark Quadrant Framework</text>
  <text class="subtitle" x="800" y="132" text-anchor="middle">A compact taxonomy for reading benchmark difficulty across AI and human performance</text>

  <!-- Axes -->
  <path class="axis" d="M 190 1045 L 1450 1045" marker-end="url(#arrow)"/>
  <path class="axis" d="M 190 1045 L 190 200" marker-end="url(#arrow)"/>

  <text class="axisHint" x="190" y="1092" text-anchor="middle">Hard for AI</text>
  <text class="axisLabel" x="820" y="1115" text-anchor="middle">AI capability</text>
  <text class="axisHint" x="1448" y="1092" text-anchor="end">Easy for AI</text>

  <text class="axisHint" x="105" y="248" text-anchor="middle" transform="rotate(-90 105 248)">Easy for humans</text>
  <text class="axisLabel" x="95" y="638" text-anchor="middle" transform="rotate(-90 95 638)">Human capability</text>
  <text class="axisHint" x="105" y="1045" text-anchor="middle">Hard for humans</text>

  <!-- Quadrant backgrounds -->
  <rect x="250" y="205" width="560" height="390" rx="24" ry="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="840" y="205" width="560" height="390" rx="24" ry="24" fill="#f7fbf8" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="250" y="615" width="560" height="390" rx="24" ry="24" fill="#fffdf7" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="840" y="615" width="560" height="390" rx="24" ry="24" fill="#f7fbff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Crosshair -->
  <line x1="830" y1="235" x2="830" y2="975" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="280" y1="605" x2="1380" y2="605" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Top-left: hard for AI, easy for humans -->
  <text class="quadTitle" x="530" y="320" text-anchor="middle">Hard for AI, Easy for Humans</text>
  <text class="quadNote" x="530" y="354" text-anchor="middle">Tasks that often expose planning, abstraction, or long-horizon control gaps</text>
  <line x1="340" y1="385" x2="720" y2="385" stroke="#64748b" stroke-width="2"/>
  <rect x="370" y="430" width="170" height="48" rx="12" ry="12" fill="#e5e7eb"/>
  <text class="chipText" x="455" y="461" text-anchor="middle">ARC-AGI</text>
  <rect x="555" y="430" width="165" height="48" rx="12" ry="12" fill="#e5e7eb"/>
  <text class="chipText" x="637" y="461" text-anchor="middle">ZeroBench</text>

  <!-- Top-right: easy for AI, easy for humans -->
  <text class="quadTitle" x="1120" y="320" text-anchor="middle">Easy for AI, Easy for Humans</text>
  <text class="quadNote" x="1120" y="354" text-anchor="middle">Baseline tasks where both systems can usually succeed with modest effort</text>
  <line x1="930" y1="385" x2="1310" y2="385" stroke="#64748b" stroke-width="2"/>
  <rect x="940" y="430" width="190" height="48" rx="12" ry="12" fill="#e5e7eb"/>
  <text class="chipText" x="1035" y="461" text-anchor="middle">MMLU-Pro</text>
  <rect x="1145" y="430" width="170" height="48" rx="12" ry="12" fill="#e5e7eb"/>
  <text class="chipText" x="1230" y="461" text-anchor="middle">tau2-bench</text>

  <!-- Bottom-left: hard for AI, hard for humans -->
  <text class="quadTitle" x="530" y="730" text-anchor="middle">Hard for AI, Hard for Humans</text>
  <text class="quadNote" x="530" y="764" text-anchor="middle">Open-ended expert tasks with substantial ambiguity, depth, or novelty</text>
  <line x1="340" y1="795" x2="720" y2="795" stroke="#64748b" stroke-width="2"/>
  <rect x="430" y="840" width="290" height="48" rx="12" ry="12" fill="#e5e7eb"/>
  <text class="chipText" x="575" y="871" text-anchor="middle">Humanity's Last Exam</text>

  <!-- Bottom-right: easy for AI, hard for humans -->
  <text class="quadTitle" x="1120" y="730" text-anchor="middle">Easy for AI, Hard for Humans</text>
  <text class="quadNote" x="1120" y="764" text-anchor="middle">Structured tasks that reward systematic execution over unaided human effort</text>
  <line x1="930" y1="795" x2="1310" y2="795" stroke="#64748b" stroke-width="2"/>
  <rect x="910" y="840" width="165" height="48" rx="12" ry="12" fill="#e5e7eb"/>
  <text class="chipText" x="992" y="871" text-anchor="middle">SWE-bench</text>
  <rect x="1090" y="840" width="210" height="48" rx="12" ry="12" fill="#e5e7eb"/>
  <text class="chipText" x="1195" y="871" text-anchor="middle">GPQA-Diamond</text>
  <rect x="1315" y="840" width="100" height="48" rx="12" ry="12" fill="#e5e7eb"/>
  <text class="chipText" x="1365" y="871" text-anchor="middle">MATH</text>

  <!-- Footer note -->
  <text class="legendText" x="800" y="1145" text-anchor="middle">Examples are indicative, not exhaustive.</text>
</svg>
