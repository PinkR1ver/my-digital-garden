<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: transparent;
    color: light-dark(#334155, #cbd5e1);
    padding: 0;
  }
  .chart-area {
    border: 1px solid light-dark(#e2e8f0, #334155);
    border-radius: 6px;
    padding: 20px 24px 16px;
    background: light-dark(#f8fafc, #0f172a20);
  }
  .chart-header {
    display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .chart-title {
    font-size: 0.92rem; font-weight: 600;
    color: light-dark(#1e293b, #e2e8f0);
  }
  .chart-subtitle {
    font-size: 0.78rem; color: light-dark(#64748b, #94a3b8);
  }
  canvas { display: block; width: 100%; height: 260px; }
  .controls { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .control-group { display: flex; flex-direction: column; gap: 4px; }
  .control-group label { font-size: 0.72rem; color: light-dark(#64748b, #94a3b8); text-transform: uppercase; letter-spacing: 0.4px; }
  .control-group input[type=range] { width: 180px; accent-color: #f59e0b; }
  .stats { display: flex; gap: 20px; margin-top: 8px; font-size: 0.8rem; color: light-dark(#475569, #cbd5e1); flex-wrap: wrap; }
  .stats strong { color: #f59e0b; font-weight: 600; }
  .legend { display: flex; gap: 18px; font-size: 0.76rem; color: light-dark(#64748b, #94a3b8); margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>
<div class="chart-area">
  <div class="chart-header">
    <span class="chart-title">给定算力预算下，模型大小 vs 最终 Loss</span>
    <span class="chart-subtitle">固定 C = N × D × 6 FLOPs，横轴是分配给模型参数的算力比例</span>
  </div>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <div class="control-group">
      <label>算力预算</label>
      <input type="range" id="budgetSlider" min="1e18" max="1e22" value="1e20" step="1e18">
    </div>
    <div class="control-group" style="min-width:130px">
      <label>预算值</label>
      <span id="budgetLabel" style="font-size:0.85rem;font-weight:600;color:#d97706">1 × 10²⁰ FLOPs</span>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span> 最优配置</div>
    <div class="legend-item"><span class="legend-dot" style="background:#94a3b8"></span> 其他配置</div>
    <div class="legend-item" style="color:#ef4444">= 模型太小，学不动</div>
    <div class="legend-item" style="color:#3b82f6">= 数据不够，过拟合</div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('budgetSlider');
  const budgetLabel = document.getElementById('budgetLabel');
  const statsDiv = document.getElementById('stats');

  const E = 0.7;
  const A = 400, B = 400;
  const alpha = 0.34, beta = 0.28;

  function loss(N, D) { return E + A / Math.pow(N, alpha) + B / Math.pow(D, beta); }

  function formatNum(n) {
    if (n >= 1e12) return (n/1e12).toFixed(1) + 'T';
    if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return n.toFixed(0);
  }

  function formatFlops(n) {
    if (n >= 1e24) return (n/1e24).toFixed(1) + ' YF';
    if (n >= 1e21) return (n/1e21).toFixed(1) + ' ZF';
    if (n >= 1e18) return (n/1e18).toFixed(1) + ' EF';
    if (n >= 1e15) return (n/1e15).toFixed(1) + ' PF';
    return n.toExponential(1) + ' FLOPs';
  }

  function findOptimal(budget) {
    let bestLoss = Infinity, bestN = 0, bestD = 0;
    const steps = 200;
    for (let i = 1; i < steps; i++) {
      const frac = i / steps;
      const N = Math.exp(Math.log(1e3) + frac * (Math.log(budget) - Math.log(1e3)));
      const D = budget / (6 * N);
      if (D < 100) continue;
      const l = loss(N, D);
      if (l < bestLoss) { bestLoss = l; bestN = N; bestD = D; }
    }
    return { N: bestN, D: bestD, loss: bestLoss };
  }

  function isDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    const W = rect.width - 48;
    const H = 260;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const dark = isDark();
    const bg    = dark ? '#0f172a' : '#f8fafc';
    const grid  = dark ? '#1e293b' : '#e2e8f0';
    const text  = dark ? '#94a3b8'  : '#64748b';
    const curve = dark ? '#94a3b8'  : '#64748b';

    const budget = parseFloat(slider.value);
    budgetLabel.textContent = formatFlops(budget);

    const optimal = findOptimal(budget);
    const Nopt = optimal.N, Dopt = optimal.D, optLoss = optimal.loss;

    const points = [];
    const steps = 150;
    for (let i = 1; i < steps; i++) {
      const frac = i / steps;
      const N = Math.exp(Math.log(1e3) + frac * (Math.log(budget) - Math.log(1e3)));
      const D = budget / (6 * N);
      if (D < 50) continue;
      points.push({ N, D, loss: loss(N, D) });
    }

    const margin = { top: 16, right: 30, bottom: 42, left: 55 };
    const pw = W - margin.left - margin.right;
    const ph = H - margin.top - margin.bottom;

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const xVals = points.map(p => p.N);
    const xMin = Math.min(...xVals), xMax = Math.max(...xVals);
    const yVals = points.map(p => p.loss);
    const yMin = E * 0.95, yMax = Math.max(...yVals) * 1.05;

    function xToPx(n) { return margin.left + (Math.log(n) - Math.log(xMin)) / (Math.log(xMax) - Math.log(xMin)) * pw; }
    function yToPx(l) { return margin.top + (l - yMin) / (yMax - yMin) * ph; }

    ctx.strokeStyle = grid;
    ctx.lineWidth = 0.6;
    for (let i = 0; i <= 4; i++) {
      const y = margin.top + (i/4) * ph;
      ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(W - margin.right, y); ctx.stroke();
    }

    ctx.fillStyle = text;
    ctx.font = '11px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('模型参数量 N →', margin.left + pw/2, H - 6);
    ctx.save();
    ctx.translate(12, margin.top + ph/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('Test Loss →', 0, 0);
    ctx.restore();

    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      const y = margin.top + (i/4)*ph;
      const val = yMax - (i/4)*(yMax - yMin);
      ctx.fillText(val.toFixed(3), margin.left - 6, y + 4);
    }

    ctx.textAlign = 'center';
    const xTicks = 4;
    for (let i = 0; i <= xTicks; i++) {
      const x = margin.left + (i/xTicks)*pw;
      const val = Math.exp(Math.log(xMin) + (i/xTicks)*(Math.log(xMax) - Math.log(xMin)));
      ctx.fillText(formatNum(Math.round(val)), x, H - margin.bottom + 16);
    }

    // Curve
    ctx.beginPath();
    ctx.strokeStyle = curve;
    ctx.lineWidth = 2;
    for (let i = 0; i < points.length; i++) {
      const px = xToPx(points[i].N), py = yToPx(points[i].loss);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Gradient fill
    const optIdx = points.findIndex(p => p.N >= Nopt);
    for (let i = 0; i < points.length - 1; i++) {
      const x0 = xToPx(points[i].N), y0 = yToPx(points[i].loss);
      const x1 = xToPx(points[i+1].N), y1 = yToPx(points[i+1].loss);
      const yBase = yToPx(yMin);
      const distFromOpt = Math.abs(i - optIdx) / Math.max(optIdx, points.length - optIdx);
      let r, g, b;
      if (distFromOpt < 0.15) { r=245; g=158; b=11; }
      else if (i < optIdx) {
        const t = Math.min(1, distFromOpt);
        r = Math.round(239 - t*100); g = Math.round(68 + t*100); b = Math.round(68 + t*100);
      } else {
        const t = Math.min(1, distFromOpt);
        r = Math.round(59 + t*100); g = Math.round(130 - t*30); b = Math.round(246 - t*100);
      }
      const alphaFill = 0.12 + 0.08 * (1 - distFromOpt);
      ctx.fillStyle = `rgba(${r},${g},${b},${alphaFill})`;
      ctx.beginPath();
      ctx.moveTo(x0, yBase); ctx.lineTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x1, yBase);
      ctx.closePath(); ctx.fill();
    }

    // Optimal point
    const optX = xToPx(Nopt), optY = yToPx(optLoss);
    ctx.beginPath(); ctx.arc(optX, optY, 5, 0, Math.PI*2);
    ctx.fillStyle = '#f59e0b'; ctx.fill();
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#f59e0b';
    ctx.font = 'bold 11px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('最优', optX + 8, optY - 8);

    statsDiv.innerHTML =
      `<span>最优模型: <strong>${formatNum(Math.round(Nopt))}</strong> params</span>
       <span>最优数据: <strong>${formatNum(Math.round(Dopt))}</strong> tokens</span>
       <span>最优 Loss: <strong>${optLoss.toFixed(3)}</strong></span>`;
  }

  slider.addEventListener('input', draw);
  window.addEventListener('resize', draw);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
