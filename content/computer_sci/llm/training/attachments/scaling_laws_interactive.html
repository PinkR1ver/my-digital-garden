<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .container {
    max-width: 720px; width: 100%;
    background: #1e293b;
    border-radius: 16px;
    padding: 28px 32px 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; color: #f1f5f9; }
  .subtitle { font-size: 0.82rem; color: #94a3b8; margin-bottom: 18px; }
  canvas { display: block; width: 100%; height: 260px; }
  .controls { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .control-group { display: flex; flex-direction: column; gap: 4px; }
  .control-group label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
  .control-group input[type=range] { width: 180px; accent-color: #f59e0b; }
  .legend { display: flex; gap: 20px; font-size: 0.78rem; color: #94a3b8; margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .stats { display: flex; gap: 24px; margin-top: 8px; font-size: 0.8rem; color: #cbd5e1; flex-wrap: wrap; }
  .stats strong { color: #f59e0b; }
</style>
</head>
<body>
<div class="container">
  <h2>给定算力预算下，模型大小 vs 最终 Loss</h2>
  <p class="subtitle">固定 C = N × D × 6 FLOPs，横轴是分配给模型参数的算力比例</p>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <div class="control-group">
      <label>算力预算</label>
      <input type="range" id="budgetSlider" min="1e18" max="1e22" value="1e20" step="1e18">
    </div>
    <div class="control-group" style="min-width:140px">
      <label>预算值</label>
      <span id="budgetLabel" style="font-size:0.85rem;font-weight:600;color:#f59e0b">1 × 10²⁰ FLOPs</span>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span> 最优配置</div>
    <div class="legend-item"><span class="legend-dot" style="background:#64748b"></span> 其他配置</div>
    <div class="legend-item" style="color:#ef4444">= 模型太小，学不动</div>
    <div class="legend-item" style="color:#3b82f6">= 数据不够，过拟合</div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('budgetSlider');
  const budgetLabel = document.getElementById('budgetLabel');
  const statsDiv = document.getElementById('stats');

  // Simplified Chinchilla-style loss function
  const E = 0.7;   // irreducible loss
  const A = 400;   // model coefficient
  const B = 400;   // data coefficient
  const alpha = 0.34;
  const beta = 0.28;

  function loss(N, D) {
    return E + A / Math.pow(N, alpha) + B / Math.pow(D, beta);
  }

  function budgetToParams(budget, fracParams) {
    // budget = 6 * N * D (approximate FLOPs per token for dense transformer)
    const N = 1 + fracParams * (budget / 6);  // fracParams controls N
    return { N, D: N > 0.9 ? (budget / (6 * N)) : budget / 6 };
  }

  function formatNum(n) {
    if (n >= 1e12) return (n/1e12).toFixed(1) + 'T';
    if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return n.toFixed(0);
  }

  function formatFlops(n) {
    if (n >= 1e24) return (n/1e24).toFixed(1) + ' YF';
    if (n >= 1e21) return (n/1e21).toFixed(1) + ' ZF';
    if (n >= 1e18) return (n/1e18).toFixed(1) + ' EF';
    if (n >= 1e15) return (n/1e15).toFixed(1) + ' PF';
    return n.toExponential(1) + ' FLOPs';
  }

  // Precompute: for a given budget, find the optimal split
  function findOptimal(budget) {
    let bestLoss = Infinity, bestN = 0, bestD = 0;
    // Search over param fractions
    const steps = 200;
    for (let i = 1; i < steps; i++) {
      const frac = i / steps;
      const N = Math.exp(Math.log(1e3) + frac * (Math.log(budget) - Math.log(1e3)));
      const D = budget / (6 * N);
      if (D < 100) continue;
      const l = loss(N, D);
      if (l < bestLoss) { bestLoss = l; bestN = N; bestD = D; }
    }
    return { N: bestN, D: bestD, loss: bestLoss };
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    const W = rect.width - 64;
    const H = 260;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const budget = parseFloat(slider.value);
    budgetLabel.textContent = formatFlops(budget);

    const optimal = findOptimal(budget);
    const Nopt = optimal.N;
    const Dopt = optimal.D;
    const optLoss = optimal.loss;

    // Compute curve: vary fraction of budget to params
    const points = [];
    const steps = 150;
    for (let i = 1; i < steps; i++) {
      const frac = i / steps;
      const N = Math.exp(Math.log(1e3) + frac * (Math.log(budget) - Math.log(1e3)));
      const D = budget / (6 * N);
      if (D < 50) continue;
      points.push({ N, D, loss: loss(N, D) });
    }

    const margin = { top: 20, right: 30, bottom: 45, left: 55 };
    const pw = W - margin.left - margin.right;
    const ph = H - margin.top - margin.bottom;

    // Background
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, W, H);

    // Ranges
    const xVals = points.map(p => p.N);
    const xMin = Math.min(...xVals); const xMax = Math.max(...xVals);
    const yVals = points.map(p => p.loss);
    const yMin = E * 0.95; const yMax = Math.max(...yVals) * 1.05;

    function xToPx(n) { return margin.left + (Math.log(n) - Math.log(xMin)) / (Math.log(xMax) - Math.log(xMin)) * pw; }
    function yToPx(l) { return margin.top + (l - yMin) / (yMax - yMin) * ph; }

    // Grid lines
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 0.6;
    for (let i = 0; i <= 4; i++) {
      const y = margin.top + (i / 4) * ph;
      ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(W - margin.right, y); ctx.stroke();
    }

    // Axes labels
    ctx.fillStyle = '#94a3b8';
    ctx.font = '11px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('模型参数量 N →', margin.left + pw/2, H - 6);
    ctx.save();
    ctx.translate(12, margin.top + ph/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('Test Loss →', 0, 0);
    ctx.restore();

    // Y ticks
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      const y = margin.top + (i / 4) * ph;
      const val = yMax - (i / 4) * (yMax - yMin);
      ctx.fillText(val.toFixed(3), margin.left - 6, y + 4);
    }

    // X ticks
    ctx.textAlign = 'center';
    const xTicks = 4;
    for (let i = 0; i <= xTicks; i++) {
      const x = margin.left + (i / xTicks) * pw;
      const val = Math.exp(Math.log(xMin) + (i / xTicks) * (Math.log(xMax) - Math.log(xMin)));
      ctx.fillText(formatNum(Math.round(val)), x, H - margin.bottom + 16);
    }

    // Loss curve
    ctx.beginPath();
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2;
    for (let i = 0; i < points.length; i++) {
      const px = xToPx(points[i].N);
      const py = yToPx(points[i].loss);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Gradient fill below curve - left side red (too small model), right side (too little data) blue
    // Left half: warm (small model → high loss = bad)
    // Around optimal: green/amber
    // Right half: cool (not enough data → high loss = bad)
    const optIdx = points.findIndex(p => p.N >= Nopt);
    for (let i = 0; i < points.length - 1; i++) {
      const x0 = xToPx(points[i].N);
      const y0 = yToPx(points[i].loss);
      const x1 = xToPx(points[i+1].N);
      const y1 = yToPx(points[i+1].loss);
      const yBase = yToPx(yMin);

      // Color based on distance from optimal
      const distFromOpt = Math.abs(i - optIdx) / Math.max(optIdx, points.length - optIdx);
      let r, g, b;
      if (distFromOpt < 0.15) {
        // Near optimal: amber/gold
        r = 245; g = 158; b = 11;
      } else if (i < optIdx) {
        // Left of optimal: red (small model)
        const t = Math.min(1, distFromOpt);
        r = Math.round(239 - t * 100);
        g = Math.round(68 + t * 100);
        b = Math.round(68 + t * 100);
      } else {
        // Right of optimal: blue (not enough data)
        const t = Math.min(1, distFromOpt);
        r = Math.round(59 + t * 100);
        g = Math.round(130 - t * 30);
        b = Math.round(246 - t * 100);
      }

      const alphaFill = 0.12 + 0.08 * (1 - distFromOpt);
      ctx.fillStyle = `rgba(${r},${g},${b},${alphaFill})`;
      ctx.beginPath();
      ctx.moveTo(x0, yBase);
      ctx.lineTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x1, yBase);
      ctx.closePath();
      ctx.fill();
    }

    // Optimal point
    const optX = xToPx(Nopt);
    const optY = yToPx(optLoss);
    ctx.beginPath();
    ctx.arc(optX, optY, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#f59e0b';
    ctx.fill();
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Optimal label
    ctx.fillStyle = '#f59e0b';
    ctx.font = 'bold 11px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('最优', optX + 8, optY - 8);

    // Stats
    statsDiv.innerHTML = `
      <span>最优模型: <strong>${formatNum(Math.round(Nopt))}</strong> params</span>
      <span>最优数据: <strong>${formatNum(Math.round(optimal.D))}</strong> tokens</span>
      <span>最优 Loss: <strong>${optLoss.toFixed(3)}</strong></span>
    `;
  }

  slider.addEventListener('input', draw);
  window.addEventListener('resize', draw);
  draw();
})();
</script>
</body>
</html>
