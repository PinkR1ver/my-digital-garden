<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-training Loss Curve</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }
  canvas { display: block; }
  .info {
    position: absolute; top: 12px; left: 16px;
    color: #a0a0c0; font-size: 11px; line-height: 1.6;
    pointer-events: none;
  }
  .info .title { color: #e0e0f0; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .phase { color: #f0c060; }
</style>
</head>
<body>
<div class="info">
  <div class="title">Training Loss → Steps</div>
  <span class="phase">I</span> &nbsp;Sharp drop — token frequencies, punctuation<br>
  <span class="phase">II</span> &nbsp;Steady descent — grammar → facts → reasoning<br>
  <span class="phase">III</span> &nbsp;Plateau — diminishing returns, data/model saturation
</div>
<script>
const W = window.innerWidth, H = window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 100);
camera.position.set(0, 3.5, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Grid
const grid = new THREE.GridHelper(7, 14, 0x333355, 0x222240);
grid.position.y = -1.8;
scene.add(grid);

// Axes
const axMat = new THREE.LineBasicMaterial({ color: 0x555580 });
const axesGeo = (pts) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); return g; };
const yAxis = new THREE.Line(axesGeo([-3.5,-1.8,0, -3.5,1.8,0]), axMat);
const xAxis = new THREE.Line(axesGeo([-3.5,-1.8,0, 3.5,-1.8,0]), axMat);
scene.add(yAxis); scene.add(xAxis);

// Labels via sprites
function makeLabel(text, x, y, z, color='#8888aa') {
  const c = document.createElement('canvas'); c.width=128; c.height=64;
  const ctx=c.getContext('2d');
  ctx.fillStyle=color; ctx.font='24px "JetBrains Mono"'; ctx.textAlign='center';
  ctx.fillText(text, 64, 32);
  const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
  const mat=new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const s=new THREE.Sprite(mat); s.position.set(x,y,z); s.scale.set(1.2,0.6,1);
  return s;
}
scene.add(makeLabel('Loss', -3.9, 0.3, 0, '#8888cc'));
scene.add(makeLabel('Steps', 0, -2.3, 0, '#8888cc'));
scene.add(makeLabel('0', -3.5, -2.1, 0));
scene.add(makeLabel('T', 3.5, -2.1, 0));

// Phase separators (vertical dashed effect)
function makePhaseLine(x, color, label, topY=1.5) {
  const pts = [x, -1.8, 0, x, topY, 0];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const mat = new THREE.LineDashedMaterial({ color, dashSize: 0.15, gapSize: 0.1 });
  const line = new THREE.Line(g, mat);
  line.computeLineDistances();
  scene.add(line);
  scene.add(makeLabel(label, x, topY+0.35, 0, color));
}
makePhaseLine(-1.2, 0xff9944, 'Phase I → II');
makePhaseLine(1.2, 0xff6644, 'Phase II → III');

// Loss curve
function lossCurve(t) {
  // t in [-3.5, 3.5] maps to training progress
  const x = (t + 3.5) / 7; // [0, 1]
  // Mimic a realistic loss curve: sharp drop then gradual
  const early = 6.0 * Math.exp(-6 * x);
  const mid = 2.0 * Math.exp(-1.8 * x);
  const late = 0.8 / (1 + 3 * x);
  return early + mid + late;
}

const curvePts = [];
const N = 300;
for (let i = 0; i <= N; i++) {
  const x = -3.5 + (i / N) * 7;
  const y = lossCurve(x) - 1.8; // offset to match grid
  curvePts.push(x, y, 0);
}
const curveGeo = new THREE.BufferGeometry();
curveGeo.setAttribute('position', new THREE.Float32BufferAttribute(curvePts, 3));
const curveMat = new THREE.LineBasicMaterial({ color: 0x66ccff, linewidth: 1 });
const curve = new THREE.Line(curveGeo, curveMat);
scene.add(curve);

// Glow curve (thicker, transparent)
const glowPts = [];
for (let i = 0; i <= N; i++) {
  glowPts.push(curvePts[i*3], curvePts[i*3+1], 0.01);
}
const glowGeo = new THREE.BufferGeometry();
glowGeo.setAttribute('position', new THREE.Float32BufferAttribute(glowPts, 3));
const glowMat = new THREE.LineBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.3 });
const glow = new THREE.Line(glowGeo, glowMat);
scene.add(glow);

// Animated dot traveling along the curve
const dotGeo = new THREE.SphereGeometry(0.08, 16, 16);
const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const dot = new THREE.Mesh(dotGeo, dotMat);
scene.add(dot);

// Ambient particles
const particlesGeo = new THREE.BufferGeometry();
const count = 80;
const pPos = new Float32Array(count * 3);
for (let i = 0; i < count; i++) {
  pPos[i*3] = (Math.random() - 0.5) * 8;
  pPos[i*3+1] = (Math.random() - 0.5) * 5;
  pPos[i*3+2] = (Math.random() - 0.5) * 2;
}
particlesGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
const particlesMat = new THREE.PointsMaterial({ color: 0x4466aa, size: 0.02, transparent: true, opacity: 0.5 });
const particles = new THREE.Points(particlesGeo, particlesMat);
scene.add(particles);

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.003;
  const progress = (Math.sin(t * 0.5) + 1) / 2; // oscillate 0-1
  const cx = -3.5 + progress * 7;
  const cy = lossCurve(cx) - 1.8;
  dot.position.set(cx, cy, 0.05);

  // Subtle camera sway
  camera.position.x = Math.sin(t * 0.3) * 0.8;
  camera.position.y = 3.5 + Math.cos(t * 0.4) * 0.3;
  camera.lookAt(0, 0, 0);

  // Rotate particles slowly
  particles.rotation.y += 0.002;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
